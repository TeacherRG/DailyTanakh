<!DOCTYPE html>
<html lang="ru" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>DailyTanakh — ежедневное изучение Невиим и Ктувим</title>
  <meta name="description" content="DailyTanakh — минималистичная платформа для ежедневного изучения Невиим (Пророков) и Ктувим (Писаний): циклы на 1 и 3 года, переводы, комментарии мудрецов, заметки и избранное. Работает офлайн." />
  <meta name="theme-color" content="#ffffff" />
  <meta name="color-scheme" content="light dark" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="DailyTanakh" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />

  <!-- no-flash theme/lang bootstrap -->
  <script>
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('dailytanakh:settings') || '{}');
        var th = s.theme || 'system';
        var dark = th === 'dark' || (th === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
        var de = document.documentElement;
        de.dataset.theme = dark ? 'dark' : 'light';
        var l = s.uiLang || 'ru';
        de.lang = l; de.dir = (l === 'he') ? 'rtl' : 'ltr';
        de.dataset.mode = s.mode || 'adult';
        if (s.fontScale) de.style.setProperty('--reader-scale', s.fontScale);
        var mc = document.querySelector('meta[name="theme-color"]');
        if (mc) mc.content = dark ? '#0a0f1d' : '#ffffff';
      } catch (e) {}
    })();
  </script>

  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/inter-latin-400.woff2" crossorigin />
  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/inter-latin-600.woff2" crossorigin />
  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/frankruhl-hebrew-400.woff2" crossorigin />

  <link rel="stylesheet" href="src/styles/fonts.css" />
  <link rel="stylesheet" href="src/styles/base.css" />
  <link rel="stylesheet" href="src/styles/components.css" />
  <link rel="stylesheet" href="src/styles/kids.css" />
  <link rel="stylesheet" href="src/styles/print.css" />

  <script type="importmap">
  {
    "imports": {
      "preact": "./vendor/preact.module.js",
      "preact/hooks": "./vendor/hooks.module.js",
      "@preact/signals-core": "./vendor/signals-core.module.js",
      "@preact/signals": "./vendor/signals.module.js",
      "htm": "./vendor/htm.module.js"
    }
  }
  </script>
</head>
<body>
  <div id="app">
    <div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px">
      <svg width="44" height="44" viewBox="0 0 32 32" fill="none">
        <rect x="1" y="1" width="30" height="30" rx="9" fill="#2456d6" />
        <path d="M9 9h7a3 3 0 0 1 3 3v12a2.2 2.2 0 0 0-2.2-2.2H9z" fill="rgba(255,255,255,.2)" stroke="#fff" stroke-width="1.5" />
        <path d="M23 9h-4a3 3 0 0 0-3 3v12a2.2 2.2 0 0 1 2.2-2.2H23z" fill="rgba(255,255,255,.3)" stroke="#fff" stroke-width="1.5" />
      </svg>
      <div style="width:26px;height:26px;border-radius:50%;border:3px solid rgba(120,140,200,.3);border-top-color:#2456d6;animation:spin .7s linear infinite"></div>
    </div>
  </div>
  <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
  <script type="module" src="src/main.js"></script>
</body>
</html>
